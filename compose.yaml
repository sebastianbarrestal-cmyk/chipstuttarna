services:
  app:
    build: .
    restart: unless-stopped
    environment:
      GUILD_PUBLIC_ORIGIN: https://${GUILD_DOMAIN:?Ange GUILD_DOMAIN i .env}
      GUILD_IDENTITY_KEY: ${GUILD_IDENTITY_KEY:?Ange GUILD_IDENTITY_KEY i .env}
      GUILD_OWNER_EMAIL: ${GUILD_OWNER_EMAIL:?Ange GUILD_OWNER_EMAIL i .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?Ange RESEND_API_KEY i .env}
      GUILD_FROM_EMAIL: ${GUILD_FROM_EMAIL:?Ange GUILD_FROM_EMAIL i .env}
      BATTLENET_CLIENT_ID: ${BATTLENET_CLIENT_ID:-}
      BATTLENET_CLIENT_SECRET: ${BATTLENET_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_JOB_SECRET: ${DISCORD_JOB_SECRET:-}
      TRUST_CADDY: '1'
    volumes:
      - guild_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      GUILD_DOMAIN: ${GUILD_DOMAIN:?Ange GUILD_DOMAIN i .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  guild_data:
  caddy_data:
  caddy_config:
